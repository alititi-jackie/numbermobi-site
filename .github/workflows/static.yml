# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build NumberMobi homepage SEO content
        run: python scripts/build-homepage.py
      - name: Build shared NumberMobi guide header and search
        run: python scripts/build-guide-header.py
      - name: Bust guide stylesheet cache
        run: find guides -name '*.html' -type f -exec sed -i "s#/guides/styles.css#/guides/styles.css?v=${GITHUB_SHA}#g" {} +
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
